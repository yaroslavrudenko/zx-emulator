[workspace]
resolver = "3"
members = ["crates/z80", "crates/spectrum", "crates/frontend", "crates/page", "crates/testsupport"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yaroslavrudenko/zx-emulator"

# Only latest stable releases. Verified against crates.io on 2026-08-31.
[workspace.dependencies]
z80 = { path = "crates/z80" }
spectrum = { path = "crates/spectrum" }
# The browser page's half of the frontend's host seam, and the only crate in this workspace
# that is not `unsafe_code = "forbid"`. `docs/M8.md` Decision 4 records why the exception is a
# crate rather than an `#[allow]`: `forbid` cannot be overridden from inside, so the choice was
# between relaxing a whole crate's posture and confining the FFI to a surface a reviewer can
# read in one sitting. It compiles on every target — off `wasm32` both entry points degrade —
# so `crates/frontend` needs no `#[cfg]` to depend on it.
page = { path = "crates/page" }
# Test support only, and never published: the corpus-absence policy every gate shares.
testsupport = { path = "crates/testsupport" }

# `default-features = false` keeps `thiserror` on `core::error::Error`, which is what
# lets `crates/z80` be `#![no_std]`.
thiserror = { version = "2.0.20", default-features = false }
anyhow = "1.0.104"
bitflags = "2.13.1"
macroquad = "0.4.16"

proptest = "1.11.0"
divan = "0.1.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# The Z80 is *meant* to wrap. Every wrap in this codebase is written as an
# explicit wrapping_* call, so debug and release must agree.
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true
