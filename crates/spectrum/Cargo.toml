[package]
name = "spectrum"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ZX Spectrum 48K and 128 machine: paged memory, ULA, contention, keyboard, tape, AY."

[dependencies]
z80.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
testsupport.workspace = true
# `docs/M7.md` Decision 3 recorded that no benchmark in this workspace exercises
# `spectrum::Ula`, and that naming one that measures a different bus is worse than naming
# none. `benches/frame.rs` is what closes that.
divan.workspace = true

[[bench]]
name = "frame"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
