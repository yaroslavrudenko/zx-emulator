[package]
name = "z80"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cycle-accurate Zilog Z80 CPU core. No I/O, no memory, no allocations."

[dependencies]
# Typed errors with a derived Display; already a workspace dependency, used by `spectrum`.
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
divan.workspace = true
testsupport.workspace = true

[[bench]]
name = "step"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
